# Regenerates the languages card daily and publishes it to the `output` branch,
# so main's history stays clean. README links to it via a raw URL.
name: activity

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.json, scripts/languages.mjs, scripts/theme.mjs, .github/workflows/activity.yml]

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Languages card
        run: node scripts/languages.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore: refresh languages card'
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
